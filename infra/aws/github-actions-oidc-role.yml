AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Least-privilege GitHub Actions OIDC role for the Firefighter Dashboard's
  existing ECR and ECS Express Mode deployment workflow. This template is not
  applied automatically.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub account or organization that owns the repository.
  GitHubRepository:
    Type: String
    Description: Repository name only, without the owner.
  GitHubBranch:
    Type: String
    Default: main
    Description: Branch allowed to assume the role.
  EcrBackendRepositoryArn:
    Type: String
    Description: ARN of the existing ECR repository that receives the backend image.
  EcrFrontendRepositoryArn:
    Type: String
    Description: ARN of the existing ECR repository that receives the frontend image.
  EcsBackendServiceArn:
    Type: String
    Description: ARN of the existing backend ECS Express Gateway service to update.
  EcsFrontendServiceArn:
    Type: String
    Description: ARN of the existing frontend ECS Express Gateway service to update.
  EcsTaskExecutionRoleArn:
    Type: String
    Description: ARN of the existing ECS task execution role.
  EcsTaskRoleArn:
    Type: String
    Description: ARN of the existing ECS application task role.
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: Existing GitHub OIDC provider ARN. Leave blank only when CreateOidcProvider is true.
  CreateOidcProvider:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Create the GitHub OIDC provider when this AWS account does not already have it.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubActionsDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      # Matches the manually configured production role assumed by deploy.yml.
      RoleName: GitHubActionsDeployRole
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: EcrAndEcsExpressDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: DescribeConfiguredDashboardRepositories
                Effect: Allow
                Action:
                  - ecr:DescribeRepositories
                Resource:
                  - !Ref EcrBackendRepositoryArn
                  - !Ref EcrFrontendRepositoryArn
              - Sid: PushOnlyToConfiguredDashboardRepositories
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !Ref EcrBackendRepositoryArn
                  - !Ref EcrFrontendRepositoryArn
              - Sid: UpdateOnlyTheConfiguredExpressServices
                Effect: Allow
                Action:
                  - ecs:DescribeExpressGatewayService
                  - ecs:UpdateExpressGatewayService
                Resource:
                  - !Ref EcsBackendServiceArn
                  - !Ref EcsFrontendServiceArn
              # ECS task-definition registration does not support a single
              # existing revision ARN as a resource scope. The action list is
              # intentionally limited to the two calls used by the workflow.
              - Sid: RegisterAndReadTaskDefinitions
                Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: '*'
              - Sid: PassOnlyExistingTaskRolesToEcsTasks
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Ref EcsTaskExecutionRoleArn
                  - !Ref EcsTaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

Outputs:
  GitHubActionsRoleArn:
    Description: Store this value in the AWS_ROLE_TO_ASSUME GitHub repository variable.
    Value: !GetAtt GitHubActionsDeploymentRole.Arn
  OidcProviderArn:
    Description: The existing or newly created GitHub OIDC provider ARN used by the role.
    Value: !If
      - ShouldCreateOidcProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingOidcProviderArn
