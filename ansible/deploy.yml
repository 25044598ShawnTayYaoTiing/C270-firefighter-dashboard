# FA contribution owner: Shawn Tay Yao Ting
# Purpose: Applies the ECS Express deployment role locally with fatal error propagation.
# Demo focus: Start here, then follow the role into preflight and backend-first rollout.
- name: Deploy Firefighter Dashboard ECS Express services
  hosts: production
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: ecs_express_deploy
