# FA contribution owner: Shawn Tay Yao Ting
# Purpose: Defines the local inventory, role, collection, and Python defaults for ECS deployment.
# Demo focus: Explain that Ansible runs locally in GitHub Actions using OIDC credentials.
[defaults]
inventory = inventories/production.yml
roles_path = roles
collections_path = ~/.ansible/collections
interpreter_python = auto_silent
retry_files_enabled = False
