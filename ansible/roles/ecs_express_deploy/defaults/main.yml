---
# FA contribution owner: Shawn Tay Yao Ting
# Purpose: Defines non-secret ECS deployment inputs and bounded verification defaults.
# Demo focus: Show the 30-minute Express Mode waiter and separate HTTP retry controls.

# GitHub Actions supplies service identifiers and URLs as extra variables.
# Credentials remain in the existing OIDC environment and never become role defaults.
ecs_express_deploy_aws_region: ''
ecs_express_deploy_backend_service_arn: ''
ecs_express_deploy_frontend_service_arn: ''
ecs_express_deploy_backend_task_definition_arn: ''
ecs_express_deploy_frontend_task_definition_arn: ''
ecs_express_deploy_previous_backend_task_definition_arn: ''
ecs_express_deploy_previous_frontend_task_definition_arn: ''
ecs_express_deploy_backend_health_url: ''
ecs_express_deploy_frontend_url: ''
ecs_express_deploy_summary_path: '{{ playbook_dir }}/deployment-summary.md'
ecs_express_deploy_diagnostics_path: '{{ playbook_dir }}/deployment-diagnostics.json'
ecs_express_deploy_github_run_id: unavailable
ecs_express_deploy_github_commit_sha: unavailable
ecs_express_deploy_github_branch: unavailable

# Express Mode performs canary traffic shifts and bake periods. Allow up to
# 30 minutes for the specific ECS service deployment, polling every 10 seconds.
ecs_express_deploy_stabilization_timeout_seconds: 1800
ecs_express_deploy_stabilization_poll_interval_seconds: 10
# HTTP checks are bounded and retain the existing ten-second request timeout.
ecs_express_deploy_health_retries: 18
ecs_express_deploy_health_delay: 10
ecs_express_deploy_health_timeout: 10
ecs_express_deploy_frontend_success_status_codes:
  - 200
  - 301
  - 302
  - 303
  - 307
  - 308
