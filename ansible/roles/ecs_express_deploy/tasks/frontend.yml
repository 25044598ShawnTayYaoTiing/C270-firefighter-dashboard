---
# FA contribution owner: Shawn Tay Yao Ting
# Purpose: Deploys the frontend revision, verifies its exact ECS deployment, then smoke tests it.
# Demo focus: Show that this file runs only after backend deployment and /health verification.

# Frontend deployment decision and baseline capture.
# An already-active revision is a safe no-op; otherwise existing deployment ARNs are recorded.
# Demo focus: Show this section is reached only after backend health has passed.
- name: Determine whether frontend deployment is required
  ansible.builtin.set_fact:
    ecs_express_deploy_frontend_update_required: >-
      {{ ecs_express_deploy_frontend_service_state.taskDefinition
         != ecs_express_deploy_frontend_task_definition_arn }}

- name: Snapshot frontend deployments before requesting the new revision
  ansible.builtin.include_tasks: capture_deployment_baseline.yml
  vars:
    ecs_express_deploy_baseline_label: frontend
    ecs_express_deploy_baseline_service_arn: '{{ ecs_express_deploy_frontend_service_arn }}'
    ecs_express_deploy_baseline_fact: ecs_express_deploy_frontend_deployment_baseline
  when: ecs_express_deploy_frontend_update_required | bool

# Frontend deployment request and service-revision correlation.
# ECS must return a service revision that references the requested frontend task definition.
# The verified revision is then used to pin one newly created deployment.
- name: Deploy frontend ECS Express service revision
  # ECS Express uses UpdateExpressGatewayService, which is not managed by the
  # standard ECS Ansible service module. This command changes only the revision.
  ansible.builtin.command:
    argv:
      - aws
      - ecs
      - update-express-gateway-service
      - --region
      - '{{ ecs_express_deploy_aws_region }}'
      - --service-arn
      - '{{ ecs_express_deploy_frontend_service_arn }}'
      - --task-definition-arn
      - '{{ ecs_express_deploy_frontend_task_definition_arn }}'
      - --query
      - 'service.targetConfiguration.{serviceRevisionArn:serviceRevisionArn,taskDefinitionArn:taskDefinitionArn}'
      - --output
      - json
      - --no-cli-pager
  register: ecs_express_deploy_frontend_update_command
  when: ecs_express_deploy_frontend_update_required | bool
  changed_when: true

- name: Record frontend target service revision returned by ECS
  ansible.builtin.set_fact:
    ecs_express_deploy_frontend_target_configuration: >-
      {{ ecs_express_deploy_frontend_update_command.stdout | from_json }}
  when: ecs_express_deploy_frontend_update_required | bool

- name: Verify frontend update response matches the requested task definition
  ansible.builtin.assert:
    that:
      - ecs_express_deploy_frontend_target_configuration.serviceRevisionArn is match('^arn:aws:ecs:')
      - ecs_express_deploy_frontend_target_configuration.taskDefinitionArn == ecs_express_deploy_frontend_task_definition_arn
    fail_msg: ECS did not return a target service revision for the requested frontend task definition.
  when: ecs_express_deploy_frontend_update_required | bool

# Authoritative frontend deployment wait and post-deployment smoke verification.
# The exact deployment must complete before the public frontend URL is accepted as updated.
# Demo focus: Show SUCCESSFUL followed by HTTP 200; a failure enters the shared rescue path.
- name: Wait for frontend ECS Express service stability
  ansible.builtin.include_tasks: wait_for_service.yml
  vars:
    ecs_express_deploy_service_label: frontend
    ecs_express_deploy_service_arn: '{{ ecs_express_deploy_frontend_service_arn }}'
    ecs_express_deploy_expected_task_definition_arn: '{{ ecs_express_deploy_frontend_task_definition_arn }}'
    ecs_express_deploy_expected_service_revision_arn: '{{ ecs_express_deploy_frontend_target_configuration.serviceRevisionArn }}'
    ecs_express_deploy_baseline_deployment_arns: '{{ ecs_express_deploy_frontend_deployment_baseline }}'
    ecs_express_deploy_wait_operation: deployment
    ecs_express_deploy_wait_result_fact: ecs_express_deploy_frontend_deployment_result
  when: ecs_express_deploy_frontend_update_required | bool

- name: Verify frontend HTTP availability
  ansible.builtin.uri:
    url: '{{ ecs_express_deploy_frontend_url }}'
    method: GET
    status_code: '{{ ecs_express_deploy_frontend_success_status_codes }}'
    return_content: false
    follow_redirects: none
    validate_certs: true
    timeout: '{{ ecs_express_deploy_health_timeout }}'
  register: ecs_express_deploy_frontend_health
  retries: '{{ ecs_express_deploy_health_retries }}'
  delay: '{{ ecs_express_deploy_health_delay }}'
  until: ecs_express_deploy_frontend_health.status in ecs_express_deploy_frontend_success_status_codes

- name: Record successful frontend smoke verification
  ansible.builtin.set_fact:
    ecs_express_deploy_frontend_health_result: passed
