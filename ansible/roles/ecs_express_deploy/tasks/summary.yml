---
# FA contribution owner: Shawn Tay Yao Ting
# Purpose: Reports deterministic deployment, verification, and rollback results to GitHub Actions.
# Demo focus: Show previous-to-new revisions, health/smoke outcomes, and rollback status.

# Human-readable deployment summary.
# Previous/requested revisions, verification states, and rollback results are reported together.
# Demo focus: Use this deterministic output as the authoritative account of the rollout.
- name: Report deployment outcome
  ansible.builtin.debug:
    msg:
      result: '{{ ecs_express_deploy_result }}'
      backend:
        revision: >-
          {{ ecs_express_deploy_previous_backend_task_definition_arn }}
          -> {{ ecs_express_deploy_backend_task_definition_arn }}
        updateRequired: '{{ ecs_express_deploy_backend_update_required | bool }}'
        serviceDeployment: '{{ ecs_express_deploy_backend_deployment_result.serviceDeploymentArn | default("unavailable") }}'
        deploymentState: '{{ ecs_express_deploy_backend_deployment_result.status | default("unavailable") }}'
        health: '{{ ecs_express_deploy_backend_health_result }}'
        rollback: '{{ ecs_express_deploy_backend_rollback_result }}'
        rollbackHealth: '{{ ecs_express_deploy_backend_rollback_health_result }}'
      frontend:
        revision: >-
          {{ ecs_express_deploy_previous_frontend_task_definition_arn }}
          -> {{ ecs_express_deploy_frontend_task_definition_arn }}
        updateRequired: '{{ ecs_express_deploy_frontend_update_required | bool }}'
        serviceDeployment: '{{ ecs_express_deploy_frontend_deployment_result.serviceDeploymentArn | default("unavailable") }}'
        deploymentState: '{{ ecs_express_deploy_frontend_deployment_result.status | default("unavailable") }}'
        smokeTest: '{{ ecs_express_deploy_frontend_health_result }}'
        rollback: '{{ ecs_express_deploy_frontend_rollback_result }}'

# GitHub Actions summary artifact.
# The same safe facts are written as Markdown for the workflow job summary.
# Gemini assistance follows separately and cannot alter these recorded outcomes.
- name: Write safe deployment details for the GitHub Actions summary
  ansible.builtin.copy:
    dest: '{{ ecs_express_deploy_summary_path }}'
    mode: '0600'
    content: |
      ### Ansible ECS deployment details

      - Result: `{{ ecs_express_deploy_result }}`
      - Backend revision: `{{ ecs_express_deploy_previous_backend_task_definition_arn }}` -> `{{ ecs_express_deploy_backend_task_definition_arn }}`
      - Backend update required: `{{ ecs_express_deploy_backend_update_required | bool }}`
      - Backend service deployment: `{{ ecs_express_deploy_backend_deployment_result.serviceDeploymentArn | default('unavailable') }}`
      - Backend deployment state: `{{ ecs_express_deploy_backend_deployment_result.status | default('unavailable') }}`
      - Backend health: `{{ ecs_express_deploy_backend_health_result }}`
      - Backend rollback: `{{ ecs_express_deploy_backend_rollback_result }}`
      - Backend health after rollback: `{{ ecs_express_deploy_backend_rollback_health_result }}`
      - Frontend revision: `{{ ecs_express_deploy_previous_frontend_task_definition_arn }}` -> `{{ ecs_express_deploy_frontend_task_definition_arn }}`
      - Frontend update required: `{{ ecs_express_deploy_frontend_update_required | bool }}`
      - Frontend service deployment: `{{ ecs_express_deploy_frontend_deployment_result.serviceDeploymentArn | default('unavailable') }}`
      - Frontend deployment state: `{{ ecs_express_deploy_frontend_deployment_result.status | default('unavailable') }}`
      - Frontend smoke test: `{{ ecs_express_deploy_frontend_health_result }}`
      - Frontend rollback: `{{ ecs_express_deploy_frontend_rollback_result }}`
      {% if ecs_express_deploy_result == 'failed' %}
      - Original failed task: `{{ ecs_express_deploy_failure_task }}`
      {% endif %}
  register: ecs_express_deploy_summary_file
  changed_when: false
  failed_when: false
