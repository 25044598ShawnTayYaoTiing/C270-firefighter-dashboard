---
# FA contribution owner: Shawn Tay Yao Ting
# Purpose: Coordinates automatic-rollback detection and explicit backend-then-frontend restoration.
# Demo focus: Show each verified rollback result while the original deployment remains failed.

# Rollback result initialization and automatic rollback detection.
# Explicit defaults distinguish not-required, attempted, succeeded, and failed recovery states.
# ECS automatic rollback evidence may satisfy recovery without issuing a duplicate update.
- name: Initialize rollback outcome tracking
  ansible.builtin.set_fact:
    ecs_express_deploy_backend_rollback_result: >-
      {{ 'pending' if ecs_express_deploy_backend_update_required | default(false) | bool
         else 'not-required' }}
    ecs_express_deploy_frontend_rollback_result: >-
      {{ 'pending' if ecs_express_deploy_frontend_update_required | default(false) | bool
         else 'not-required' }}
    ecs_express_deploy_backend_rollback_health_result: >-
      {{ 'pending' if ecs_express_deploy_backend_update_required | default(false) | bool
         else 'not-required' }}
    ecs_express_deploy_backend_automatic_rollback_complete: >-
      {{ ecs_express_deploy_backend_update_required | default(false) | bool
         and ecs_express_deploy_backend_deployment_result.status | default('') == 'ROLLBACK_SUCCESSFUL'
         and ecs_express_deploy_backend_deployment_result.rollbackServiceRevisionArn | default('')
             == ecs_express_deploy_backend_service_state.serviceRevision }}
    ecs_express_deploy_frontend_automatic_rollback_complete: >-
      {{ ecs_express_deploy_frontend_update_required | default(false) | bool
         and ecs_express_deploy_frontend_deployment_result.status | default('') == 'ROLLBACK_SUCCESSFUL'
         and ecs_express_deploy_frontend_deployment_result.rollbackServiceRevisionArn | default('')
             == ecs_express_deploy_frontend_service_state.serviceRevision }}

# Backend rollback runs before frontend rollback.
# The controller preserves the established recovery order and imports exact backend verification.
# Demo focus: Show backend restoration and post-rollback health before frontend handling.
- name: Run backend rollback deployment and verification tasks
  ansible.builtin.import_tasks: rollback_backend.yml

# Frontend rollback retains the existing second position.
# It runs only after backend rollback handling and verifies its own exact ECS deployment when needed.
# The combined outcome is reported next without changing the original failure.
- name: Run frontend rollback deployment and verification tasks
  ansible.builtin.import_tasks: rollback_frontend.yml

# Combined rollback diagnostics output.
# Backend health and both service recovery states are condensed for operators and later summaries.
# Demo focus: Point out whether rollback was required, attempted, and authoritatively verified.
- name: Report rollback verification outcome
  ansible.builtin.debug:
    msg:
      backend:
        attempted: '{{ ecs_express_deploy_backend_update_required | default(false) | bool }}'
        automatic: '{{ ecs_express_deploy_backend_automatic_rollback_complete | bool }}'
        result: '{{ ecs_express_deploy_backend_rollback_result }}'
        health: '{{ ecs_express_deploy_backend_rollback_health_result }}'
        deploymentState: '{{ ecs_express_deploy_backend_rollback_deployment_result.status | default("unavailable") }}'
      frontend:
        attempted: '{{ ecs_express_deploy_frontend_update_required | default(false) | bool }}'
        automatic: '{{ ecs_express_deploy_frontend_automatic_rollback_complete | bool }}'
        result: '{{ ecs_express_deploy_frontend_rollback_result }}'
        deploymentState: '{{ ecs_express_deploy_frontend_rollback_deployment_result.status | default("unavailable") }}'
