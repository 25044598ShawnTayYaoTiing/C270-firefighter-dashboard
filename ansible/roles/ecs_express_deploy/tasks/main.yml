---
# FA contribution owner: Shawn Tay Yao Ting
# Purpose: Orchestrates preflight, backend-first rollout, verification, diagnostics, and rollback.
# Demo focus: Trace the guarded order and show that rollback never masks the original failure.

# Preflight and deployment-result initialization.
# Inputs, identity, and current service state are checked before deterministic result facts are reset.
# The guarded backend-first block starts only after both imports succeed.
- name: Run deployment preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags: [preflight, deploy]

- name: Import deployment-result initialization tasks
  ansible.builtin.import_tasks: initialize.yml

# Backend-first deployment and verification.
# Backend ECS completion and /health gate the frontend rollout and smoke test.
# Demo focus: A failure collects diagnostics, verifies rollback, writes evidence, and preserves failure.
- name: Deploy backend, verify it, then deploy frontend
  block:
    - name: Deploy and verify backend
      ansible.builtin.import_tasks: backend.yml
      tags: [backend, verify, deploy]

    - name: Deploy and verify frontend
      ansible.builtin.import_tasks: frontend.yml
      tags: [frontend, verify, deploy]
  rescue:
    # Original failure capture and safe diagnostics collection
    - name: Preserve the original deployment failure
      ansible.builtin.set_fact:
        ecs_express_deploy_result: failed
        ecs_express_deploy_failure_stage: >-
          {{ 'backend_health'
             if ansible_failed_task.name | default('')
                == 'Verify backend application health endpoint'
             else 'frontend_smoke'
             if ansible_failed_task.name | default('')
                == 'Verify frontend HTTP availability'
             else 'backend_deployment'
             if 'backend' in (ansible_failed_task.name | default('') | lower)
             else 'frontend_deployment'
             if 'frontend' in (ansible_failed_task.name | default('') | lower)
             else 'deployment' }}
        ecs_express_deploy_failure_task: '{{ ansible_failed_task.name | default("unknown task") }}'
        ecs_express_deploy_failure_message: >-
          {{ ansible_failed_result.msg
             | default('See the preceding Ansible task output for the original failure.') }}
        ecs_express_deploy_backend_health_result: >-
          {{ 'failed'
             if ansible_failed_task.name | default('')
                == 'Verify backend application health endpoint'
             else ecs_express_deploy_backend_health_result }}
        ecs_express_deploy_frontend_health_result: >-
          {{ 'failed'
             if ansible_failed_task.name | default('')
                == 'Verify frontend HTTP availability'
             else ecs_express_deploy_frontend_health_result }}

    - name: Collect safe ECS failure diagnostics
      ansible.builtin.import_tasks: collect_diagnostics.yml
      tags: [deploy, diagnostics]

    # Deterministic rollback remains after diagnostics collection
    - name: Restore and verify prior task definitions
      ansible.builtin.import_tasks: rollback.yml
      tags: [deploy, rollback]
  always:
    # Summary and allowlisted diagnostics artifact generation
    - name: Record the deployment and rollback summary
      ansible.builtin.import_tasks: summary.yml
      tags: [deploy, summary]

    - name: Write allowlisted diagnostics after rollback outcome is known
      ansible.builtin.import_tasks: write_failure_diagnostics.yml
      when: ecs_express_deploy_result == 'failed'
      tags: [deploy, diagnostics]

# Original deployment failure propagation.
# Rollback details are appended for operators but never replace the initial deployment error.
# Demo focus: A recovered service can coexist with an intentionally FAILED deployment job.
- name: Fail with the original deployment context after rollback verification
  ansible.builtin.fail:
    msg: >-
      Deployment failed at "{{ ecs_express_deploy_failure_task }}":
      {{ ecs_express_deploy_failure_message }}
      Rollback results:
      backend={{ ecs_express_deploy_backend_rollback_result }},
      backend_health={{ ecs_express_deploy_backend_rollback_health_result }},
      frontend={{ ecs_express_deploy_frontend_rollback_result }}.
  when: ecs_express_deploy_result == 'failed'
  tags: [deploy]
