---
# FA contribution owner: Shawn Tay Yao Ting
# Purpose: Captures existing deployment ARNs so a later update maps to one new exact deployment.
# Demo focus: Explain how the baseline prevents an older SUCCESSFUL deployment from being reused.

# Baseline discovery records deployment ARNs before any service update is sent.
# The waiter later excludes this list so only the requested operation can satisfy verification.
- name: Snapshot ECS service deployments before update - {{ ecs_express_deploy_baseline_label }}
  ansible.builtin.command:
    argv:
      - aws
      - ecs
      - list-service-deployments
      - --region
      - '{{ ecs_express_deploy_aws_region }}'
      - --service
      - '{{ ecs_express_deploy_baseline_service_arn }}'
      - --query
      - serviceDeployments[].serviceDeploymentArn
      - --output
      - json
      - --no-cli-pager
      - --cli-connect-timeout
      - '5'
      - --cli-read-timeout
      - '15'
  register: ecs_express_deploy_baseline_command
  changed_when: false

- name: Record ECS deployment baseline - {{ ecs_express_deploy_baseline_label }}
  ansible.builtin.set_fact:
    '{{ ecs_express_deploy_baseline_fact }}': >-
      {{ ecs_express_deploy_baseline_command.stdout | from_json }}
