---
# FA contribution owner: Shawn Tay Yao Ting
# Purpose: Deploys the backend revision, verifies its exact ECS deployment, then checks /health.
# Demo focus: Show that frontend deployment cannot begin until this backend sequence succeeds.

# Backend deployment decision and baseline capture.
# An already-active revision is a safe no-op; a real update first records existing deployment ARNs.
# Demo focus: Point out idempotency and the baseline used to identify only the new deployment.
- name: Determine whether backend deployment is required
  ansible.builtin.set_fact:
    ecs_express_deploy_backend_update_required: >-
      {{ ecs_express_deploy_backend_service_state.taskDefinition
         != ecs_express_deploy_backend_task_definition_arn }}

- name: Snapshot backend deployments before requesting the new revision
  ansible.builtin.include_tasks: capture_deployment_baseline.yml
  vars:
    ecs_express_deploy_baseline_label: backend
    ecs_express_deploy_baseline_service_arn: '{{ ecs_express_deploy_backend_service_arn }}'
    ecs_express_deploy_baseline_fact: ecs_express_deploy_backend_deployment_baseline
  when: ecs_express_deploy_backend_update_required | bool

# Backend deployment request and service-revision correlation.
# ECS returns the target service revision, which must reference the requested task definition.
# The verified revision becomes the key used to find the exact service deployment next.
- name: Deploy backend ECS Express service revision
  # ECS Express uses UpdateExpressGatewayService, which is not managed by the
  # standard ECS Ansible service module. This command changes only the revision.
  ansible.builtin.command:
    argv:
      - aws
      - ecs
      - update-express-gateway-service
      - --region
      - '{{ ecs_express_deploy_aws_region }}'
      - --service-arn
      - '{{ ecs_express_deploy_backend_service_arn }}'
      - --task-definition-arn
      - '{{ ecs_express_deploy_backend_task_definition_arn }}'
      - --query
      - 'service.targetConfiguration.{serviceRevisionArn:serviceRevisionArn,taskDefinitionArn:taskDefinitionArn}'
      - --output
      - json
      - --no-cli-pager
  register: ecs_express_deploy_backend_update_command
  when: ecs_express_deploy_backend_update_required | bool
  changed_when: true

- name: Record backend target service revision returned by ECS
  ansible.builtin.set_fact:
    ecs_express_deploy_backend_target_configuration: >-
      {{ ecs_express_deploy_backend_update_command.stdout | from_json }}
  when: ecs_express_deploy_backend_update_required | bool

- name: Verify backend update response matches the requested task definition
  ansible.builtin.assert:
    that:
      - ecs_express_deploy_backend_target_configuration.serviceRevisionArn is match('^arn:aws:ecs:')
      - ecs_express_deploy_backend_target_configuration.taskDefinitionArn == ecs_express_deploy_backend_task_definition_arn
    fail_msg: ECS did not return a target service revision for the requested backend task definition.
  when: ecs_express_deploy_backend_update_required | bool

# Authoritative backend deployment wait and post-deployment health verification.
# ECS must complete the pinned deployment before the public /health check can prove the new API.
# Demo focus: Show SUCCESSFUL first, then HTTP 200; either failure enters rescue and rollback.
- name: Wait for backend ECS Express service stability
  ansible.builtin.include_tasks: wait_for_service.yml
  vars:
    ecs_express_deploy_service_label: backend
    ecs_express_deploy_service_arn: '{{ ecs_express_deploy_backend_service_arn }}'
    ecs_express_deploy_expected_task_definition_arn: '{{ ecs_express_deploy_backend_task_definition_arn }}'
    ecs_express_deploy_expected_service_revision_arn: '{{ ecs_express_deploy_backend_target_configuration.serviceRevisionArn }}'
    ecs_express_deploy_baseline_deployment_arns: '{{ ecs_express_deploy_backend_deployment_baseline }}'
    ecs_express_deploy_wait_operation: deployment
    ecs_express_deploy_wait_result_fact: ecs_express_deploy_backend_deployment_result
  when: ecs_express_deploy_backend_update_required | bool

- name: Verify backend application health endpoint
  ansible.builtin.uri:
    url: '{{ ecs_express_deploy_backend_health_url }}'
    method: GET
    status_code: 200
    return_content: true
    validate_certs: true
    timeout: '{{ ecs_express_deploy_health_timeout }}'
  register: ecs_express_deploy_backend_health
  retries: '{{ ecs_express_deploy_health_retries }}'
  delay: '{{ ecs_express_deploy_health_delay }}'
  until:
    - ecs_express_deploy_backend_health.status == 200
    - ecs_express_deploy_backend_health.json is defined
    - ecs_express_deploy_backend_health.json.status | default('') == 'ok'

- name: Record successful backend health verification
  ansible.builtin.set_fact:
    ecs_express_deploy_backend_health_result: passed
