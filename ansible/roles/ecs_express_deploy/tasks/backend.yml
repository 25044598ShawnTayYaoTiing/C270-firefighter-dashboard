---
- name: Determine whether backend deployment is required
  ansible.builtin.set_fact:
    ecs_express_deploy_backend_update_required: >-
      {{ ecs_express_deploy_backend_service_state.taskDefinition
         != ecs_express_deploy_backend_task_definition_arn }}

- name: Deploy backend ECS Express service revision
  # ECS Express uses UpdateExpressGatewayService, which is not managed by the
  # standard ECS Ansible service module. This command changes only the revision.
  ansible.builtin.command:
    argv:
      - aws
      - ecs
      - update-express-gateway-service
      - --region
      - '{{ ecs_express_deploy_aws_region }}'
      - --service-arn
      - '{{ ecs_express_deploy_backend_service_arn }}'
      - --task-definition-arn
      - '{{ ecs_express_deploy_backend_task_definition_arn }}'
  when: ecs_express_deploy_backend_update_required | bool
  changed_when: true

- name: Wait for backend ECS Express service stability
  ansible.builtin.include_tasks: wait_for_service.yml
  vars:
    ecs_express_deploy_service_label: backend
    ecs_express_deploy_service_arn: '{{ ecs_express_deploy_backend_service_arn }}'
    ecs_express_deploy_expected_task_definition_arn: '{{ ecs_express_deploy_backend_task_definition_arn }}'

- name: Verify backend application health endpoint
  ansible.builtin.uri:
    url: '{{ ecs_express_deploy_backend_health_url }}'
    method: GET
    status_code: 200
    return_content: true
    validate_certs: true
    timeout: '{{ ecs_express_deploy_health_timeout }}'
  register: ecs_express_deploy_backend_health
  retries: '{{ ecs_express_deploy_health_retries }}'
  delay: '{{ ecs_express_deploy_health_delay }}'
  until:
    - ecs_express_deploy_backend_health.status == 200
    - ecs_express_deploy_backend_health.json is defined
    - ecs_express_deploy_backend_health.json.status | default('') == 'ok'
