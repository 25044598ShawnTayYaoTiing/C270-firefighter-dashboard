services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # The browser reaches the backend through this same-origin UI gateway.
      BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1/login
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      # RealtimeSTT remains an optional external dependency. On Docker Desktop,
      # host.docker.internal reaches the existing host-side service.
      REALTIME_STT_HEALTH_URL: ${REALTIME_STT_HEALTH_URL:-http://host.docker.internal:8010/health}
      REALTIME_STT_WS_URL: ${REALTIME_STT_WS_URL:-}
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/login').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
