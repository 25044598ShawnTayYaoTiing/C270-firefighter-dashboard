# FA contribution owner: Kong Ji Xun
# Purpose: Orchestrates the frontend and backend on a private bridge network with
# Docker DNS, health-aware ordering, bounded probes, and host-only development ports.
# Demo focus: Trace browser-to-frontend-to-backend traffic, then show health and recovery.
name: firefighter-dashboard

services:
  # Frontend service builds the Nginx gateway and addresses the backend by Compose DNS name.
  # It starts only after backend health passes, then exposes the application on localhost.
  # Demo focus: Point out BACKEND_URL=http://backend:3000 and service_healthy ordering.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Local container traffic always uses Compose service discovery.
      BACKEND_URL: http://backend:3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    # Health-based dependency ordering prevents Nginx from starting against an unready API.
    # Once the backend is healthy, the frontend probe validates its own gateway endpoint.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - firefighter-network
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1/health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 15s

  # Backend service receives runtime configuration without baking secrets into its image.
  # Its /health probe gates frontend startup and supports failure/recovery demonstration.
  # Demo focus: Show the internal port, optional host port, and bounded health retries.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-firefighter.sid}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DB_HOST: ${DB_HOST:?DB_HOST must be set in .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:?DB_USER must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_NAME: ${DB_NAME:?DB_NAME must be set in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-30000}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_AUTH_MODE: ${GOOGLE_AUTH_MODE:-}
      ONEMAP_EMAIL: ${ONEMAP_EMAIL:-}
      ONEMAP_PASSWORD: ${ONEMAP_PASSWORD:-}
      ONEMAP_BASE_URL: ${ONEMAP_BASE_URL:-https://www.onemap.gov.sg}
      GEOCODING_DEBUG: ${GEOCODING_DEBUG:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3000"
    networks:
      - firefighter-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then(async response => {
            const body = await response.json();
            if (!response.ok || body.status !== 'ok') process.exit(1);
          })
          .catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 15s

# A user-defined bridge supplies private service discovery as backend on firefighter-network.
# Demo focus: Show that container-to-container traffic does not use localhost or host ports.
networks:
  firefighter-network:
    driver: bridge
