# FA responsibility: Ji Xun — Docker Compose / Multi-container Orchestration
# Optional local-development overlay. It mounts an existing ADC file read-only;
# it never copies credentials into an image or repository.
services:
  backend:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/google-credentials/application_default_credentials.json
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS_HOST:?Set GOOGLE_APPLICATION_CREDENTIALS_HOST to your local ADC file}
        target: /var/run/google-credentials/application_default_credentials.json
        read_only: true
        bind:
          create_host_path: false
