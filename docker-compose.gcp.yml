# FA contribution owner: Kong Ji Xun
# Purpose: Adds an optional local Compose overlay that mounts existing Google ADC read-only.
# Demo focus: Explain that credentials stay outside the image and repository.

# The overlay changes only backend runtime environment and volume configuration.
# The base services, private network, health ordering, and ports remain unchanged.
services:
  backend:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/google-credentials/application_default_credentials.json
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS_HOST:?Set GOOGLE_APPLICATION_CREDENTIALS_HOST to your local ADC file}
        target: /var/run/google-credentials/application_default_credentials.json
        read_only: true
        bind:
          create_host_path: false
