name: CodeQL (optional additional analysis)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL JavaScript analysis
    # CodeQL is supplementary. Semgrep remains the deploy-gating SAST control,
    # so private repositories without Code Scanning entitlement remain protected.
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Initialize CodeQLp
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
