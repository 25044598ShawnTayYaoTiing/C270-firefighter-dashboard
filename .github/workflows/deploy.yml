# FA contribution owners: Khin Kyi Phyu Zin, Fatin Farha Binte Sahidin, and Shawn Tay Yao Ting
# Purpose: Orchestrates gated CI, container security, immutable image promotion,
# AWS ECS deployment, and advisory Gemini deployment summaries.
# Demo focus: Trace how every gate passes before OIDC, then follow the scanned
# images through verified deployment and the final advisory summary.
name: DevSecOps CI/CD

# Workflow triggers and manual controls (Khin Kyi Phyu Zin).
# Pull requests validate only, main pushes deploy, and manual runs require explicit inputs.
# Demo focus: Point out that pull-request code cannot enter the AWS deployment path.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after all security gates pass (manual runs default to scan-only)
        required: true
        default: false
        type: boolean
      run_gemini_deployment_demo:
        description: Run Gemini Deployment Summary and Failure Diagnostics Demo after a successful manual deployment
        required: true
        default: false
        type: boolean
      inject_health_failure:
        description: 'FA practice only: return HTTP 503 from backend /health (requires deploy=true)'
        required: true
        default: false
        type: boolean

# Workflow-wide permissions and concurrency keep orchestration least-privileged and serialized.
# Jobs request additional authority only where required; a newer run replaces stale work.
# Demo focus: Contrast read-only CI jobs with the single OIDC-enabled deployment job.
permissions:
  contents: read

concurrency:
  group: firefighter-dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  BACKEND_IMAGE: firefighter-dashboard-backend:${{ github.sha }}
  FRONTEND_IMAGE: firefighter-dashboard-frontend:${{ github.sha }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
  ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
  ECS_BACKEND_SERVICE_ARN: ${{ vars.ECS_BACKEND_SERVICE_ARN }}
  ECS_FRONTEND_SERVICE_ARN: ${{ vars.ECS_FRONTEND_SERVICE_ARN }}
  APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
  APP_SMOKE_URL: ${{ vars.APP_SMOKE_URL }}

# CI and dependency gate (Khin Kyi Phyu Zin and Fatin Farha Binte Sahidin).
# Locked dependencies, tests, and the production audit must pass before image building.
# Demo focus: Show that test or HIGH/CRITICAL dependency failures stop the flow here.
jobs:
  quality:
    name: Test and dependency security gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      # The production dependency audit blocks vulnerable runtime packages before images exist.
      # A passing result allows the remaining security gates to feed the build job.
      - name: Block HIGH or CRITICAL production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  # Secret scanning gate (Fatin Farha Binte Sahidin).
  # Full Git history is scanned so exposed credentials block downstream image production.
  # Demo focus: Show Gitleaks completing before any AWS authentication is available.
  secret-scan:
    name: Secret scanning gate
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository and history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'

  # Source security gate (Fatin Farha Binte Sahidin).
  # Semgrep checks JavaScript and OWASP rules, then retains a SARIF report for review.
  # Demo focus: Show that an ERROR finding prevents the container build from starting.
  sast:
    name: Source security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Semgrep JavaScript and OWASP rules
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            semgrep/semgrep:1.159.0 \
            semgrep scan \
              --metrics off \
              --config p/javascript \
              --config p/owasp-top-ten \
              --severity ERROR \
              --error \
              --sarif \
              --output semgrep.sarif \
              .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30

  # Gated image build and artifact orchestration (Khin Kyi Phyu Zin), using the
  # backend image from Kaung Khant Thein and frontend image from Kaung Min Khant.
  # This job starts only after every CI/security prerequisite passes.
  # Demo focus: Identify the two SHA-tagged images that will be scanned and promoted.
  build-and-scan:
    name: Build and container security gate
    needs:
      - quality
      - secret-scan
      - sast
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      backend_image: ${{ steps.image-metadata.outputs.backend_image }}
      frontend_image: ${{ steps.image-metadata.outputs.frontend_image }}
      backend_image_tar_sha256: ${{ steps.image-artifact.outputs.sha256 }}
      frontend_image_tar_sha256: ${{ steps.image-artifact.outputs.frontend_sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the backend image to be deployed
        run: |
          set -euo pipefail
          docker build --pull --tag "${BACKEND_IMAGE}" .

      - name: Build the frontend image
        run: |
          set -euo pipefail
          docker build --pull --file frontend/Dockerfile --tag "${FRONTEND_IMAGE}" .

      - name: Record immutable image metadata
        id: image-metadata
        run: |
          set -euo pipefail
          docker image inspect "${BACKEND_IMAGE}" > backend-image-inspect.json
          docker image inspect "${FRONTEND_IMAGE}" > frontend-image-inspect.json
          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"

      # Container security gate (Fatin Farha Binte Sahidin).
      # Trivy scans both images and blocks HIGH/CRITICAL findings before export.
      # Demo focus: Show the blocking scan result and retained SARIF evidence.
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Generate human-readable Trivy reports
        run: |
          set -euo pipefail
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --format table "${BACKEND_IMAGE}"
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --format table "${FRONTEND_IMAGE}"

      - name: Generate Trivy SARIF reports
        run: |
          set -euo pipefail
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --format sarif --output trivy-backend.sarif "${BACKEND_IMAGE}"
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --format sarif --output trivy-frontend.sarif "${FRONTEND_IMAGE}"

      - name: Block HIGH or CRITICAL backend image vulnerabilities
        run: |
          set -euo pipefail
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --exit-code 1 --format table "${BACKEND_IMAGE}"

      - name: Block HIGH or CRITICAL frontend image vulnerabilities
        run: |
          set -euo pipefail
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --exit-code 1 --format table "${FRONTEND_IMAGE}"

      # Immutable image hand-off (Khin Kyi Phyu Zin).
      # The exact scanned images and checksums become short-lived deployment artifacts.
      # Demo focus: Explain that deployment cannot rebuild or substitute another image.
      - name: Export the exact scanned images
        id: image-artifact
        run: |
          set -euo pipefail
          docker save --output backend-image.tar "${BACKEND_IMAGE}"
          sha256sum backend-image.tar > backend-image.tar.sha256
          docker save --output frontend-image.tar "${FRONTEND_IMAGE}"
          sha256sum frontend-image.tar > frontend-image.tar.sha256
          echo "sha256=$(awk '{print $1}' backend-image.tar.sha256)" >> "$GITHUB_OUTPUT"
          echo "frontend_sha256=$(awk '{print $1}' frontend-image.tar.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload Trivy and image metadata reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
            backend-image-inspect.json
            frontend-image-inspect.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload exact scanned images
        uses: actions/upload-artifact@v4
        with:
          name: scanned-images
          path: |
            backend-image.tar
            backend-image.tar.sha256
            frontend-image.tar
            frontend-image.tar.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Summarise gated build
        run: |
          {
            echo '## Security gate passed'
            echo
            echo "- Backend image: \`${BACKEND_IMAGE}\`"
            echo "- Frontend image: \`${FRONTEND_IMAGE}\`"
            echo '- Tests, Gitleaks, npm audit, Semgrep, and Trivy passed before any AWS authentication.'
          } >> "$GITHUB_STEP_SUMMARY"

  # AWS ECS deployment automation (Shawn Tay Yao Ting), entered only through
  # Khin Kyi Phyu Zin's completed job dependencies and deployment conditions.
  # It promotes the scanned artifacts, verifies backend first, then verifies frontend.
  # Demo focus: Follow OIDC, ECR, task revisions, Ansible, health, and smoke results.
  deploy:
    name: Push, deploy, verify, and smoke test
    needs:
      - quality
      - secret-scan
      - sast
      - build-and-scan
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.deploy || inputs.run_gemini_deployment_demo))
    runs-on: ubuntu-latest
    # Covers two 30-minute canary waiters plus bounded verified rollback on failure.
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    outputs:
      deployment_analysis_ready: ${{ steps.deployment-analysis-evidence-status.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deployment preconditions and artifact integrity.
      # Required repository variables and image checksums are verified before AWS access.
      # Demo focus: Show that only the previously scanned image archives are loaded.
      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          required=(AWS_REGION AWS_ROLE_TO_ASSUME ECR_BACKEND_REPOSITORY ECR_FRONTEND_REPOSITORY ECS_BACKEND_SERVICE_ARN ECS_FRONTEND_SERVICE_ARN APP_HEALTH_URL APP_SMOKE_URL)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Repository variable ${name} must be configured before deployment." >&2
              exit 1
            fi
          done

          if [ "${ECR_BACKEND_REPOSITORY}" = "${ECR_FRONTEND_REPOSITORY}" ]; then
            echo 'ECR_BACKEND_REPOSITORY and ECR_FRONTEND_REPOSITORY must be different repositories.' >&2
            exit 1
          fi

          if [ "${ECS_BACKEND_SERVICE_ARN}" = "${ECS_FRONTEND_SERVICE_ARN}" ]; then
            echo 'ECS_BACKEND_SERVICE_ARN and ECS_FRONTEND_SERVICE_ARN must be different ECS services.' >&2
            exit 1
          fi

          case "${APP_HEALTH_URL}" in
            */health)
              ;;
            *)
              echo 'APP_HEALTH_URL must point to the public /health endpoint.' >&2
              exit 1
              ;;
          esac

      - name: Record deployment assessment start time
        run: echo "DEPLOYMENT_STARTED_AT_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download the exact scanned images
        uses: actions/download-artifact@v4
        with:
          name: scanned-images

      - name: Verify artifact integrity and load the scanned images
        run: |
          set -euo pipefail
          expected_backend_sha256="${{ needs.build-and-scan.outputs.backend_image_tar_sha256 }}"
          expected_frontend_sha256="${{ needs.build-and-scan.outputs.frontend_image_tar_sha256 }}"
          actual_backend_sha256="$(awk '{print $1}' backend-image.tar.sha256)"
          actual_frontend_sha256="$(awk '{print $1}' frontend-image.tar.sha256)"
          [ "${actual_backend_sha256}" = "${expected_backend_sha256}" ]
          [ "$(sha256sum backend-image.tar | awk '{print $1}')" = "${expected_backend_sha256}" ]
          [ "${actual_frontend_sha256}" = "${expected_frontend_sha256}" ]
          [ "$(sha256sum frontend-image.tar | awk '{print $1}')" = "${expected_frontend_sha256}" ]
          docker load --input backend-image.tar
          docker load --input frontend-image.tar
          docker image inspect "${BACKEND_IMAGE}" > /dev/null
          docker image inspect "${FRONTEND_IMAGE}" > /dev/null

      # OIDC authentication and ECR promotion (Shawn Tay Yao Ting).
      # GitHub assumes the deployment role temporarily, verifies identity, then pushes both images.
      # Demo focus: Highlight that no long-lived AWS access key is stored in GitHub.
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          role-session-name: firefighter-dashboard-github-actions

      - name: Reject root credentials and capture account identity
        run: |
          set -euo pipefail
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          case "${caller_arn}" in
            arn:aws:iam::*:root)
              echo 'AWS root credentials are not permitted for deployment.' >&2
              exit 1
              ;;
          esac
          case "${caller_arn}" in
            arn:aws:sts::*:assumed-role/GitHubActionsDeployRole/*)
              ;;
            *)
              echo 'OIDC did not assume the expected GitHubActionsDeployRole.' >&2
              exit 1
              ;;
          esac
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify configured ECR repositories exist
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "${ECR_BACKEND_REPOSITORY}" > /dev/null
          aws ecr describe-repositories --repository-names "${ECR_FRONTEND_REPOSITORY}" > /dev/null

      - name: Tag and push the exact scanned images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          backend_ecr_image="${ECR_REGISTRY}/${ECR_BACKEND_REPOSITORY}:${GITHUB_SHA}"
          backend_latest_image="${ECR_REGISTRY}/${ECR_BACKEND_REPOSITORY}:latest"
          frontend_ecr_image="${ECR_REGISTRY}/${ECR_FRONTEND_REPOSITORY}:${GITHUB_SHA}"
          frontend_latest_image="${ECR_REGISTRY}/${ECR_FRONTEND_REPOSITORY}:latest"
          docker tag "${BACKEND_IMAGE}" "${backend_ecr_image}"
          docker tag "${BACKEND_IMAGE}" "${backend_latest_image}"
          docker tag "${FRONTEND_IMAGE}" "${frontend_ecr_image}"
          docker tag "${FRONTEND_IMAGE}" "${frontend_latest_image}"
          docker push "${backend_ecr_image}"
          docker push "${backend_latest_image}"
          docker push "${frontend_ecr_image}"
          docker push "${frontend_latest_image}"
          {
            echo "BACKEND_ECR_IMAGE=${backend_ecr_image}"
            echo "FRONTEND_ECR_IMAGE=${frontend_ecr_image}"
            echo "ECR_REGISTRY=${ECR_REGISTRY}"
          } >> "$GITHUB_ENV"

      # ECS task-definition registration (Shawn Tay Yao Ting).
      # Active definitions are cloned with only the intended image and supervised demo flag changes.
      # Demo focus: Point out the previous and requested backend/frontend revision ARNs.
      - name: Create task-definition revisions for both ECS services
        env:
          FA_DEMO_HEALTH_FAILURE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.inject_health_failure && 'true' || 'false' }}
        run: |
          set -euo pipefail
          resolve_active_task_definition() {
            local service_arn="$1"
            aws ecs describe-express-gateway-service \
              --service-arn "${service_arn}" \
              --query 'service.activeConfigurations[0].taskDefinitionArn' \
              --output text
          }

          resolve_single_container_name() {
            local task_definition_file="$1"
            local repository_name="$2"
            jq -er --arg repository "${repository_name}" '
              . as $task
              | [
                  $task.containerDefinitions[]
                  | select(
                      (.image // "")
                      | (contains("/" + $repository + ":") or contains("/" + $repository + "@"))
                    )
                  | .name
                ]
              | if length == 1 then
                  .[0]
                elif ($task.containerDefinitions | length) == 1 then
                  $task.containerDefinitions[0].name
                else
                  error("Could not identify exactly one application container from the active task definition")
                end
            ' "${task_definition_file}"
          }

          backend_service_arn="${ECS_BACKEND_SERVICE_ARN}"
          frontend_service_arn="${ECS_FRONTEND_SERVICE_ARN}"
          previous_backend_task_definition_arn="$(resolve_active_task_definition "${backend_service_arn}")"
          previous_frontend_task_definition_arn="$(resolve_active_task_definition "${frontend_service_arn}")"

          for task_definition_arn in "${previous_backend_task_definition_arn}" "${previous_frontend_task_definition_arn}"; do
            if [ -z "${task_definition_arn}" ] || [ "${task_definition_arn}" = 'None' ]; then
              echo 'Could not find an active ECS task definition for both services.' >&2
              exit 1
            fi
          done

          aws ecs describe-task-definition \
            --task-definition "${previous_backend_task_definition_arn}" \
            --query taskDefinition \
            --output json > backend-task-definition.json
          aws ecs describe-task-definition \
            --task-definition "${previous_frontend_task_definition_arn}" \
            --query taskDefinition \
            --output json > frontend-task-definition.json

          backend_container_name="$(resolve_single_container_name backend-task-definition.json "${ECR_BACKEND_REPOSITORY}")"
          frontend_container_name="$(resolve_single_container_name frontend-task-definition.json "${ECR_FRONTEND_REPOSITORY}")"

          jq \
            --arg name "${backend_container_name}" \
            --arg image "${BACKEND_ECR_IMAGE}" \
            --arg inject_health_failure "${FA_DEMO_HEALTH_FAILURE_REQUESTED}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            | .containerDefinitions = (
                .containerDefinitions
                | map(
                    if .name == $name then
                      .image = $image
                      | .environment = (
                          ((.environment // [])
                            | map(select(.name != "FA_DEMO_HEALTH_FAILURE")))
                          + (if $inject_health_failure == "true" then
                               [{"name": "FA_DEMO_HEALTH_FAILURE", "value": "true"}]
                             else
                               []
                             end)
                        )
                    else
                      .
                    end
                  )
              )
          ' backend-task-definition.json > new-backend-task-definition.json

          jq \
            --arg name "${frontend_container_name}" \
            --arg image "${FRONTEND_ECR_IMAGE}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            | .containerDefinitions = (
                .containerDefinitions | map(if .name == $name then .image = $image else . end)
              )
          ' frontend-task-definition.json > new-frontend-task-definition.json

          backend_task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file://new-backend-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          frontend_task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file://new-frontend-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          {
            echo "BACKEND_SERVICE_ARN=${backend_service_arn}"
            echo "FRONTEND_SERVICE_ARN=${frontend_service_arn}"
            echo "PREVIOUS_BACKEND_TASK_DEFINITION_ARN=${previous_backend_task_definition_arn}"
            echo "PREVIOUS_FRONTEND_TASK_DEFINITION_ARN=${previous_frontend_task_definition_arn}"
            echo "BACKEND_TASK_DEFINITION_ARN=${backend_task_definition_arn}"
            echo "FRONTEND_TASK_DEFINITION_ARN=${frontend_task_definition_arn}"
            echo "BACKEND_CONTAINER_NAME=${backend_container_name}"
            echo "FRONTEND_CONTAINER_NAME=${frontend_container_name}"
          } >> "$GITHUB_ENV"

      # Ansible backend-first rollout and verification (Shawn Tay Yao Ting).
      # Constrained tooling deploys the backend, verifies its exact ECS deployment and /health,
      # then deploys the frontend and runs the smoke test; failures enter verified rollback.
      # Demo focus: Show that frontend rollout starts only after backend verification passes.
      - name: Install constrained Ansible deployment tooling
        run: |
          set -euo pipefail
          python3 -m pip install --user --requirement ansible/requirements.txt
          "${HOME}/.local/bin/ansible-galaxy" collection install --force --requirements-file ansible/requirements.yml
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy backend first with Ansible, then verify frontend
        id: ansible-deploy
        working-directory: ansible
        env:
          ANSIBLE_FORCE_COLOR: 'true'
        run: |
          set -euo pipefail
          ansible-playbook deploy.yml \
            --extra-vars "ecs_express_deploy_aws_region=${AWS_REGION}" \
            --extra-vars "ecs_express_deploy_backend_service_arn=${BACKEND_SERVICE_ARN}" \
            --extra-vars "ecs_express_deploy_frontend_service_arn=${FRONTEND_SERVICE_ARN}" \
            --extra-vars "ecs_express_deploy_backend_task_definition_arn=${BACKEND_TASK_DEFINITION_ARN}" \
            --extra-vars "ecs_express_deploy_frontend_task_definition_arn=${FRONTEND_TASK_DEFINITION_ARN}" \
            --extra-vars "ecs_express_deploy_previous_backend_task_definition_arn=${PREVIOUS_BACKEND_TASK_DEFINITION_ARN}" \
            --extra-vars "ecs_express_deploy_previous_frontend_task_definition_arn=${PREVIOUS_FRONTEND_TASK_DEFINITION_ARN}" \
            --extra-vars "ecs_express_deploy_backend_health_url=${APP_HEALTH_URL}" \
            --extra-vars "ecs_express_deploy_frontend_url=${APP_SMOKE_URL}" \
            --extra-vars "ecs_express_deploy_github_run_id=${GITHUB_RUN_ID}" \
            --extra-vars "ecs_express_deploy_github_commit_sha=${GITHUB_SHA}" \
            --extra-vars "ecs_express_deploy_github_branch=${GITHUB_REF_NAME}"

      # Sanitized deployment-evidence hand-off (Shawn Tay Yao Ting).
      # Deterministic Ansible/ECS results are reduced to bounded non-secret evidence for Gemini.
      # Demo focus: Show the retained artifact without exposing task environments or credentials.
      - name: Prepare sanitized deployment evidence
        id: prepare-deployment-analysis
        if: >-
          always() &&
          (steps.ansible-deploy.outcome == 'success' ||
          steps.ansible-deploy.outcome == 'failure')
        env:
          ANSIBLE_DEPLOY_OUTCOME: ${{ steps.ansible-deploy.outcome }}
        run: |
          set -euo pipefail
          echo 'ready=false' >> "$GITHUB_OUTPUT"

          if [ "${ANSIBLE_DEPLOY_OUTCOME}" = 'success' ]; then
            evidence_outcome='SUCCESS'
            input_arguments=()
          else
            evidence_outcome='FAILED'
            if [ ! -f ansible/deployment-diagnostics.json ]; then
              echo 'Ansible failure diagnostics were unavailable; Gemini deployment assistance will use a safe fallback summary.'
              exit 0
            fi
            input_arguments=(ansible/deployment-diagnostics.json)
          fi

          if ! node scripts/deployment-analysis/prepareDeploymentEvidence.js \
            "${evidence_outcome}" \
            deployment-diagnostics.json \
            "${input_arguments[@]}"; then
            echo 'Sanitized deployment evidence could not be prepared; Gemini deployment assistance will use a safe fallback summary.'
            exit 0
          fi

          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Upload sanitized deployment evidence
        id: upload-deployment-analysis-evidence
        if: always() && steps.prepare-deployment-analysis.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deployment-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-diagnostics.json
          if-no-files-found: error
          retention-days: 7

      - name: Record Gemini deployment evidence availability
        id: deployment-analysis-evidence-status
        if: always()
        env:
          EVIDENCE_PREPARED: ${{ steps.prepare-deployment-analysis.outputs.ready }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.upload-deployment-analysis-evidence.outcome }}
        run: |
          ready=false
          if [ "${EVIDENCE_PREPARED}" = 'true' ] && [ "${EVIDENCE_UPLOAD_OUTCOME}" = 'success' ]; then
            ready=true
          fi
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      # Authoritative deployment summary.
      # GitHub Actions records immutable images, revisions, and Ansible outcomes before advisory analysis.
      # Demo focus: Emphasize that these deterministic results remain the source of truth.
      - name: Write deployment summary
        if: always()
        env:
          ANSIBLE_DEPLOY_OUTCOME: ${{ steps.ansible-deploy.outcome }}
        run: |
          {
            echo '## Deployment summary'
            echo
            echo "- Immutable backend image target: \`${BACKEND_ECR_IMAGE}\`"
            echo "- Immutable frontend image target: \`${FRONTEND_ECR_IMAGE}\`"
            echo "- Previous backend task definition: \`${PREVIOUS_BACKEND_TASK_DEFINITION_ARN}\`"
            echo "- Requested backend task definition: \`${BACKEND_TASK_DEFINITION_ARN}\`"
            echo "- Previous frontend task definition: \`${PREVIOUS_FRONTEND_TASK_DEFINITION_ARN}\`"
            echo "- Requested frontend task definition: \`${FRONTEND_TASK_DEFINITION_ARN}\`"
            echo "- Resolved ECS containers: \`${BACKEND_CONTAINER_NAME}\`, \`${FRONTEND_CONTAINER_NAME}\`"
            echo "- Ansible deployment step outcome: \`${ANSIBLE_DEPLOY_OUTCOME}\`"
            echo
            if [ -f ansible/deployment-summary.md ]; then
              cat ansible/deployment-summary.md
            else
              echo 'Ansible deployment details were unavailable because deployment did not reach outcome tracking.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Advisory Gemini deployment summary and failure diagnostics (Shawn Tay Yao Ting).
  # This isolated read-only job consumes sanitized evidence and cannot deploy or roll back.
  # Demo focus: Show the model assessment, human-review flag, and zero AWS authority.
  gemini-deployment-analysis:
    name: Gemini Deployment Summary
    needs: deploy
    if: >-
      always() &&
      (needs.deploy.result == 'success' ||
      needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out analysis code
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Set up Node.js
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked production dependencies
        continue-on-error: true
        run: npm ci --omit=dev --ignore-scripts

      - name: Download sanitized deployment evidence
        id: download-deployment-analysis-evidence
        if: needs.deploy.outputs.deployment_analysis_ready == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deployment-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}

      # Production advisory analysis.
      # Gemini summarizes success or suggests failure checks; validation and fallback preserve safety.
      # Demo focus: Compare the AI assessment with the authoritative deployment result above it.
      - name: Generate Gemini Deployment Summary
        if: always()
        continue-on-error: true
        env:
          DEPLOYMENT_GEMINI_API_KEY: ${{ secrets.DEPLOYMENT_GEMINI_API_KEY }}
          DEPLOYMENT_GEMINI_MODEL: ${{ vars.DEPLOYMENT_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          DEPLOYMENT_ANALYSIS_OUTCOME: ${{ needs.deploy.result }}
        run: |
          node scripts/deployment-analysis/analyzeDeploymentFailure.js \
            deployment-diagnostics.json \
            gemini-deployment-summary.md \
            gemini-deployment-analysis.json

      - name: Write Gemini Deployment Summary
        if: always()
        continue-on-error: true
        env:
          DEPLOYMENT_GEMINI_MODEL: ${{ vars.DEPLOYMENT_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          DEPLOYMENT_OUTCOME: ${{ needs.deploy.result }}
        run: |
          if [ -f gemini-deployment-summary.md ]; then
            cat gemini-deployment-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            normalized_outcome="${DEPLOYMENT_OUTCOME^^}"
            fallback_risk='HIGH'
            if [ "${normalized_outcome}" = 'SUCCESS' ]; then
              fallback_risk='MEDIUM'
            fi
            {
              echo '# Gemini Deployment Summary'
              echo
              echo '> **AI-GENERATED OPERATIONAL ASSESSMENT — ADVISORY ONLY**'
              echo
              echo '## Execution'
              echo '- Mode: **FALLBACK**'
              echo "- Model: **${DEPLOYMENT_GEMINI_MODEL}**"
              echo "- Deployment outcome: **${normalized_outcome}**"
              echo '- Classification: **UNKNOWN**'
              echo "- Risk level: **${fallback_risk}**"
              echo
              echo '## Pipeline Evidence'
              echo '- Tests: **UNAVAILABLE**'
              echo '- Security gates: **UNAVAILABLE**'
              echo '- Container scanning: **UNAVAILABLE**'
              echo '- ECS stabilization: **UNAVAILABLE**'
              echo '- Backend health: **UNAVAILABLE**'
              echo '- Frontend smoke test: **UNAVAILABLE**'
              echo
              echo '## Gemini Failure Diagnostics'
              echo 'Operational summary: Gemini deployment summary and failure diagnostics could not be generated; the deterministic deployment result remains authoritative.'
              echo
              echo 'Recommended checks/actions: Review the deployment job summary and authoritative Ansible result.'
              echo
              echo '## Safety'
              echo '- Human review required: **YES**'
              echo '- AWS credentials available to Gemini summary job: **NO**'
              echo '- OIDC permission: **NO**'
              echo '- AWS calls: **0**'
              echo '- Deployment actions: **0**'
              echo '- Rollback actions: **0**'
              echo '- Automatic remediation: **0**'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Optional supervised FA demonstration.
      # A manual successful deployment may analyze synthetic failure evidence without changing AWS.
      # Demo focus: Identify the separate synthetic label and confirm no remediation is executed.
      - name: Prepare Gemini Deployment Demo synthetic sanitized diagnostics
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.run_gemini_deployment_demo &&
          needs.deploy.result == 'success'
        continue-on-error: true
        run: >-
          node scripts/deployment-analysis/demo/runWorkflowDemo.js
          prepare
          gemini-deployment-demo-sanitized.json

      - name: Run Gemini Deployment Demo synthetic advisory analysis
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.run_gemini_deployment_demo &&
          needs.deploy.result == 'success'
        continue-on-error: true
        env:
          DEPLOYMENT_GEMINI_API_KEY: ${{ secrets.DEPLOYMENT_GEMINI_API_KEY }}
          DEPLOYMENT_GEMINI_MODEL: ${{ vars.DEPLOYMENT_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_DEMO_REAL_DEPLOYMENT_RESULT: SUCCESS
        run: >-
          node scripts/deployment-analysis/demo/runWorkflowDemo.js
          analyze
          gemini-deployment-demo-sanitized.json
