name: DevSecOps CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after all security gates pass (manual runs default to scan-only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: firefighter-dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  BACKEND_IMAGE: firefighter-dashboard-backend:${{ github.sha }}
  FRONTEND_IMAGE: firefighter-dashboard-frontend:${{ github.sha }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
  ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
  ECS_BACKEND_SERVICE_ARN: ${{ vars.ECS_BACKEND_SERVICE_ARN }}
  ECS_FRONTEND_SERVICE_ARN: ${{ vars.ECS_FRONTEND_SERVICE_ARN }}
  APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
  APP_SMOKE_URL: ${{ vars.APP_SMOKE_URL }}

jobs:
  quality:
    name: Test and dependency security gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Block HIGH or CRITICAL production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scanning gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository and history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'

  sast:
    name: Source security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Semgrep JavaScript and OWASP rules
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            semgrep/semgrep:1.159.0 \
            semgrep scan \
              --metrics off \
              --config p/javascript \
              --config p/owasp-top-ten \
              --severity ERROR \
              --error \
              --sarif \
              --output semgrep.sarif \
              .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30

  build-and-scan:
    name: Build and container security gate
    needs:
      - quality
      - secret-scan
      - sast
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      backend_image: ${{ steps.image-metadata.outputs.backend_image }}
      frontend_image: ${{ steps.image-metadata.outputs.frontend_image }}
      backend_image_tar_sha256: ${{ steps.image-artifact.outputs.sha256 }}
      frontend_image_tar_sha256: ${{ steps.image-artifact.outputs.frontend_sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the backend image to be deployed
        run: |
          set -euo pipefail
          docker build --pull --tag "${BACKEND_IMAGE}" .

      - name: Build the frontend image
        run: |
          set -euo pipefail
          docker build --pull --file frontend/Dockerfile --tag "${FRONTEND_IMAGE}" .

      - name: Record immutable image metadata
        id: image-metadata
        run: |
          set -euo pipefail
          docker image inspect "${BACKEND_IMAGE}" > backend-image-inspect.json
          docker image inspect "${FRONTEND_IMAGE}" > frontend-image-inspect.json
          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Generate human-readable Trivy reports
        run: |
          set -euo pipefail
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --format table "${BACKEND_IMAGE}"
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --format table "${FRONTEND_IMAGE}"

      - name: Generate Trivy SARIF reports
        run: |
          set -euo pipefail
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --format sarif --output trivy-backend.sarif "${BACKEND_IMAGE}"
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --format sarif --output trivy-frontend.sarif "${FRONTEND_IMAGE}"

      - name: Block HIGH or CRITICAL backend image vulnerabilities
        run: |
          set -euo pipefail
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --exit-code 1 --format table "${BACKEND_IMAGE}"

      - name: Block HIGH or CRITICAL frontend image vulnerabilities
        run: |
          set -euo pipefail
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --exit-code 1 --format table "${FRONTEND_IMAGE}"

      - name: Export the exact scanned images
        id: image-artifact
        run: |
          set -euo pipefail
          docker save --output backend-image.tar "${BACKEND_IMAGE}"
          sha256sum backend-image.tar > backend-image.tar.sha256
          docker save --output frontend-image.tar "${FRONTEND_IMAGE}"
          sha256sum frontend-image.tar > frontend-image.tar.sha256
          echo "sha256=$(awk '{print $1}' backend-image.tar.sha256)" >> "$GITHUB_OUTPUT"
          echo "frontend_sha256=$(awk '{print $1}' frontend-image.tar.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload Trivy and image metadata reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
            backend-image-inspect.json
            frontend-image-inspect.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload exact scanned images
        uses: actions/upload-artifact@v4
        with:
          name: scanned-images
          path: |
            backend-image.tar
            backend-image.tar.sha256
            frontend-image.tar
            frontend-image.tar.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Summarise gated build
        run: |
          {
            echo '## Security gate passed'
            echo
            echo "- Backend image: \`${BACKEND_IMAGE}\`"
            echo "- Frontend image: \`${FRONTEND_IMAGE}\`"
            echo '- Tests, Gitleaks, npm audit, Semgrep, and Trivy passed before any AWS authentication.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Push, deploy, verify, and smoke test
    needs:
      - quality
      - secret-scan
      - sast
      - build-and-scan
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          required=(AWS_REGION AWS_ROLE_TO_ASSUME ECR_BACKEND_REPOSITORY ECR_FRONTEND_REPOSITORY ECS_BACKEND_SERVICE_ARN ECS_FRONTEND_SERVICE_ARN APP_HEALTH_URL APP_SMOKE_URL)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Repository variable ${name} must be configured before deployment." >&2
              exit 1
            fi
          done

          if [ "${ECR_BACKEND_REPOSITORY}" = "${ECR_FRONTEND_REPOSITORY}" ]; then
            echo 'ECR_BACKEND_REPOSITORY and ECR_FRONTEND_REPOSITORY must be different repositories.' >&2
            exit 1
          fi

          if [ "${ECS_BACKEND_SERVICE_ARN}" = "${ECS_FRONTEND_SERVICE_ARN}" ]; then
            echo 'ECS_BACKEND_SERVICE_ARN and ECS_FRONTEND_SERVICE_ARN must be different ECS services.' >&2
            exit 1
          fi

          case "${APP_HEALTH_URL}" in
            */health)
              ;;
            *)
              echo 'APP_HEALTH_URL must point to the public /health endpoint.' >&2
              exit 1
              ;;
          esac

      - name: Download the exact scanned images
        uses: actions/download-artifact@v4
        with:
          name: scanned-images

      - name: Verify artifact integrity and load the scanned images
        run: |
          set -euo pipefail
          expected_backend_sha256="${{ needs.build-and-scan.outputs.backend_image_tar_sha256 }}"
          expected_frontend_sha256="${{ needs.build-and-scan.outputs.frontend_image_tar_sha256 }}"
          actual_backend_sha256="$(awk '{print $1}' backend-image.tar.sha256)"
          actual_frontend_sha256="$(awk '{print $1}' frontend-image.tar.sha256)"
          [ "${actual_backend_sha256}" = "${expected_backend_sha256}" ]
          [ "$(sha256sum backend-image.tar | awk '{print $1}')" = "${expected_backend_sha256}" ]
          [ "${actual_frontend_sha256}" = "${expected_frontend_sha256}" ]
          [ "$(sha256sum frontend-image.tar | awk '{print $1}')" = "${expected_frontend_sha256}" ]
          docker load --input backend-image.tar
          docker load --input frontend-image.tar
          docker image inspect "${BACKEND_IMAGE}" > /dev/null
          docker image inspect "${FRONTEND_IMAGE}" > /dev/null

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          role-session-name: firefighter-dashboard-github-actions

      - name: Reject root credentials and capture account identity
        run: |
          set -euo pipefail
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          case "${caller_arn}" in
            arn:aws:iam::*:root)
              echo 'AWS root credentials are not permitted for deployment.' >&2
              exit 1
              ;;
          esac
          case "${caller_arn}" in
            arn:aws:sts::*:assumed-role/GitHubActionsDeployRole/*)
              ;;
            *)
              echo 'OIDC did not assume the expected GitHubActionsDeployRole.' >&2
              exit 1
              ;;
          esac
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify configured ECR repositories exist
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "${ECR_BACKEND_REPOSITORY}" > /dev/null
          aws ecr describe-repositories --repository-names "${ECR_FRONTEND_REPOSITORY}" > /dev/null

      - name: Tag and push the exact scanned images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          backend_ecr_image="${ECR_REGISTRY}/${ECR_BACKEND_REPOSITORY}:${GITHUB_SHA}"
          backend_latest_image="${ECR_REGISTRY}/${ECR_BACKEND_REPOSITORY}:latest"
          frontend_ecr_image="${ECR_REGISTRY}/${ECR_FRONTEND_REPOSITORY}:${GITHUB_SHA}"
          frontend_latest_image="${ECR_REGISTRY}/${ECR_FRONTEND_REPOSITORY}:latest"
          docker tag "${BACKEND_IMAGE}" "${backend_ecr_image}"
          docker tag "${BACKEND_IMAGE}" "${backend_latest_image}"
          docker tag "${FRONTEND_IMAGE}" "${frontend_ecr_image}"
          docker tag "${FRONTEND_IMAGE}" "${frontend_latest_image}"
          docker push "${backend_ecr_image}"
          docker push "${backend_latest_image}"
          docker push "${frontend_ecr_image}"
          docker push "${frontend_latest_image}"
          {
            echo "BACKEND_ECR_IMAGE=${backend_ecr_image}"
            echo "FRONTEND_ECR_IMAGE=${frontend_ecr_image}"
            echo "ECR_REGISTRY=${ECR_REGISTRY}"
          } >> "$GITHUB_ENV"

      - name: Create task-definition revisions for both ECS services
        run: |
          set -euo pipefail
          resolve_active_task_definition() {
            local service_arn="$1"
            aws ecs describe-express-gateway-service \
              --service-arn "${service_arn}" \
              --query 'service.activeConfigurations[0].taskDefinitionArn' \
              --output text
          }

          resolve_single_container_name() {
            local task_definition_file="$1"
            local repository_name="$2"
            jq -er --arg repository "${repository_name}" '
              . as $task
              | [
                  $task.containerDefinitions[]
                  | select(
                      (.image // "")
                      | (contains("/" + $repository + ":") or contains("/" + $repository + "@"))
                    )
                  | .name
                ]
              | if length == 1 then
                  .[0]
                elif ($task.containerDefinitions | length) == 1 then
                  $task.containerDefinitions[0].name
                else
                  error("Could not identify exactly one application container from the active task definition")
                end
            ' "${task_definition_file}"
          }

          backend_service_arn="${ECS_BACKEND_SERVICE_ARN}"
          frontend_service_arn="${ECS_FRONTEND_SERVICE_ARN}"
          previous_backend_task_definition_arn="$(resolve_active_task_definition "${backend_service_arn}")"
          previous_frontend_task_definition_arn="$(resolve_active_task_definition "${frontend_service_arn}")"

          for task_definition_arn in "${previous_backend_task_definition_arn}" "${previous_frontend_task_definition_arn}"; do
            if [ -z "${task_definition_arn}" ] || [ "${task_definition_arn}" = 'None' ]; then
              echo 'Could not find an active ECS task definition for both services.' >&2
              exit 1
            fi
          done

          aws ecs describe-task-definition \
            --task-definition "${previous_backend_task_definition_arn}" \
            --query taskDefinition \
            --output json > backend-task-definition.json
          aws ecs describe-task-definition \
            --task-definition "${previous_frontend_task_definition_arn}" \
            --query taskDefinition \
            --output json > frontend-task-definition.json

          backend_container_name="$(resolve_single_container_name backend-task-definition.json "${ECR_BACKEND_REPOSITORY}")"
          frontend_container_name="$(resolve_single_container_name frontend-task-definition.json "${ECR_FRONTEND_REPOSITORY}")"

          jq \
            --arg name "${backend_container_name}" \
            --arg image "${BACKEND_ECR_IMAGE}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            | .containerDefinitions = (
                .containerDefinitions | map(if .name == $name then .image = $image else . end)
              )
          ' backend-task-definition.json > new-backend-task-definition.json

          jq \
            --arg name "${frontend_container_name}" \
            --arg image "${FRONTEND_ECR_IMAGE}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            | .containerDefinitions = (
                .containerDefinitions | map(if .name == $name then .image = $image else . end)
              )
          ' frontend-task-definition.json > new-frontend-task-definition.json

          backend_task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file://new-backend-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          frontend_task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file://new-frontend-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          {
            echo "BACKEND_SERVICE_ARN=${backend_service_arn}"
            echo "FRONTEND_SERVICE_ARN=${frontend_service_arn}"
            echo "PREVIOUS_BACKEND_TASK_DEFINITION_ARN=${previous_backend_task_definition_arn}"
            echo "PREVIOUS_FRONTEND_TASK_DEFINITION_ARN=${previous_frontend_task_definition_arn}"
            echo "BACKEND_TASK_DEFINITION_ARN=${backend_task_definition_arn}"
            echo "FRONTEND_TASK_DEFINITION_ARN=${frontend_task_definition_arn}"
            echo "BACKEND_CONTAINER_NAME=${backend_container_name}"
            echo "FRONTEND_CONTAINER_NAME=${frontend_container_name}"
          } >> "$GITHUB_ENV"

      - name: Install constrained Ansible deployment tooling
        run: |
          set -euo pipefail
          python3 -m pip install --user --requirement ansible/requirements.txt
          "${HOME}/.local/bin/ansible-galaxy" collection install --force --requirements-file ansible/requirements.yml
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy backend first with Ansible, then verify frontend
        working-directory: ansible
        env:
          ANSIBLE_FORCE_COLOR: 'true'
        run: |
          set -euo pipefail
          ansible-playbook deploy.yml \
            --extra-vars "ecs_express_deploy_aws_region=${AWS_REGION}" \
            --extra-vars "ecs_express_deploy_backend_service_arn=${BACKEND_SERVICE_ARN}" \
            --extra-vars "ecs_express_deploy_frontend_service_arn=${FRONTEND_SERVICE_ARN}" \
            --extra-vars "ecs_express_deploy_backend_task_definition_arn=${BACKEND_TASK_DEFINITION_ARN}" \
            --extra-vars "ecs_express_deploy_frontend_task_definition_arn=${FRONTEND_TASK_DEFINITION_ARN}" \
            --extra-vars "ecs_express_deploy_previous_backend_task_definition_arn=${PREVIOUS_BACKEND_TASK_DEFINITION_ARN}" \
            --extra-vars "ecs_express_deploy_previous_frontend_task_definition_arn=${PREVIOUS_FRONTEND_TASK_DEFINITION_ARN}" \
            --extra-vars "ecs_express_deploy_backend_health_url=${APP_HEALTH_URL}" \
            --extra-vars "ecs_express_deploy_frontend_url=${APP_SMOKE_URL}"

      - name: Write deployment summary
        run: |
          {
            echo '## Deployment summary'
            echo
            echo "- Immutable backend image deployed: \`${BACKEND_ECR_IMAGE}\`"
            echo "- Immutable frontend image deployed: \`${FRONTEND_ECR_IMAGE}\`"
            echo "- Previous backend task definition: \`${PREVIOUS_BACKEND_TASK_DEFINITION_ARN}\`"
            echo "- Active backend task definition: \`${BACKEND_TASK_DEFINITION_ARN}\`"
            echo "- Previous frontend task definition: \`${PREVIOUS_FRONTEND_TASK_DEFINITION_ARN}\`"
            echo "- Active frontend task definition: \`${FRONTEND_TASK_DEFINITION_ARN}\`"
            echo "- ECS containers updated: \`${BACKEND_CONTAINER_NAME}\`, \`${FRONTEND_CONTAINER_NAME}\`"
            echo '- Ansible preflight, backend ECS stability, backend health, frontend ECS stability, and frontend HTTP validation: passed.'
            echo '- On a post-update failure, Ansible requests the saved previous task definitions for services changed in this run.'
          } >> "$GITHUB_STEP_SUMMARY"
