# FA contribution owner: Shawn Tay Yao Ting
# Purpose: Runs a manual, synthetic Gemini failure-diagnostics demonstration with
# sanitized evidence and no AWS, deployment, rollback, or remediation authority.
# Demo focus: Show the advisory result and safety counters without affecting ECS.
name: Gemini Deployment Demo

# Manual-only trigger and read-only permissions keep the demonstration isolated.
# The main-branch guard ensures the checked demonstration matches reviewed code.
# Demo focus: Point out the absence of id-token and AWS credential steps.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-deployment-fa-demo-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

# Synthetic evidence preparation runs before the guarded Gemini analysis.
# The same production sanitizer and analyzer are exercised without a cloud failure.
# Demo focus: Show the generated summary and confirm the evidence is explicitly synthetic.
jobs:
  demonstrate:
    name: Synthetic Gemini failure diagnostics
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out demonstration code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked production dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Prepare synthetic sanitized diagnostics
        run: >-
          node scripts/deployment-analysis/demo/runWorkflowDemo.js
          prepare
          gemini-deployment-demo-sanitized.json

      - name: Run guarded Gemini Failure Diagnostics and write summary
        env:
          DEPLOYMENT_GEMINI_API_KEY: ${{ secrets.DEPLOYMENT_GEMINI_API_KEY }}
          DEPLOYMENT_GEMINI_MODEL: ${{ vars.DEPLOYMENT_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: >-
          node scripts/deployment-analysis/demo/runWorkflowDemo.js
          analyze
          gemini-deployment-demo-sanitized.json
