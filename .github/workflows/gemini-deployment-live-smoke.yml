# FA contribution owner: Shawn Tay Yao Ting
# Purpose: Validates the production Gemini client, schema, and evidence grounding
# against synthetic sanitized input without invoking AWS or a deployment.
# Demo focus: Show LIVE Gemini validation while every infrastructure action remains zero.
name: Gemini Deployment Summary and Failure Diagnostics LIVE Smoke Test

# The workflow is manual, main-only, and read-only so it cannot alter cloud resources.
# Concurrency prevents overlapping smoke tests from producing confusing evidence.
# Demo focus: Point out that only the Gemini secret and model variable are consumed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-deployment-live-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

# The isolated smoke job installs locked dependencies and invokes the real analyzer path.
# A pass proves request, parsing, schema, and evidence validation work together.
# Demo focus: Show LIVE GEMINI, validation PASS results, and no OIDC permission.
jobs:
  live-gemini-smoke:
    name: Validate production Gemini summary and diagnostics path
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out deployment-analysis code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked production dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Run unmocked Gemini deployment analyzer smoke test
        env:
          DEPLOYMENT_GEMINI_API_KEY: ${{ secrets.DEPLOYMENT_GEMINI_API_KEY }}
          DEPLOYMENT_GEMINI_MODEL: ${{ vars.DEPLOYMENT_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: npm run gemini:deployment:smoke:live
